manifest:
  # 〈Self-Governance Oath〉— 外部依存8モジュールは cardinal-sys 配下へ自前管理フォーク済み。
  # 上流リポジトリへの参照は完全に断ち、以後の更新はこちらの意思でのみ行う。
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cardinal-sys
      url-base: https://github.com/cardinal-sys

  projects:
    - name: zmk
      remote: zmkfirmware
      # 〈Known-Good Anchor〉— Build #227 (run 27451380456) が引いた上流に固定。
      # `main` のままだとビルドの度に上流が動き、同じコミットでも別物が焼き上がる。
      # 実機で無線動作を確認できている唯一の基準点なのでここへ錨を下ろす。
      revision: ff09f2d0c9f13a868c8f71d71d9348ade438e4b6
      path: zmk
      import: app/west.yml

    # 〈Zephyr Anchor〉— zmk の app/west.yml は zephyr を `v4.1.0+zmk-fixes`
    # という **ブランチ** で指しているため、zmk を SHA 固定しても zephyr だけは
    # ビルドの度に先端へ流れる（#227=58a5874a に対し 2026-08-02 時点で 9df4b12b）。
    # west は「取り込む側（本 manifest）の定義が取り込まれる側に優先する」ため、
    # ここで同名 project を再定義して #227 と同じコミットへ固定する。
    # import ブロックは zmk 側 (ff09f2d) の内容をそのまま複製すること
    # ―― name-blocklist が食い違うとモジュール構成が変わる。
    - name: zephyr
      remote: zmkfirmware
      revision: 58a5874a446ace2893a196848282d271a551e512
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m

    - name: zmk-pmw3610-driver
      remote: cardinal-sys
      # 〈Accumulation Gate〉— PR #1 のマージコミット。`no-sample-accumulation`
      # を新設し、250Hz 前提で書かれた 2 サンプル蓄積を 125Hz 構成で
      # 切れるようにした。既定は従来通り蓄積するため後方互換。
      revision: 47db819
      path: modules/zmk-pmw3610-driver

    - name: zmk-listeners
      remote: cardinal-sys
      # `v1` はタグではなくブランチ。#227 時点の実コミットへ固定。
      revision: c240cea
      path: modules/zmk-listeners

    - name: zmk-mouse-gesture
      remote: cardinal-sys
      revision: efc89e1c3d758fd782c7bbea429161f0d1fddad3
      path: modules/zmk-mouse-gesture

    - name: zmk-scroll-snap
      remote: cardinal-sys
      # `v1` はブランチのため #227(1f8fc86) → #228(dd21a0f) で黙って動いていた。
      # 差分は docs のみだが再現性のため #227 時点へ固定。
      revision: 1f8fc86
      path: modules/zmk-scroll-snap

    - name: zmk-rgbled-widget
      remote: cardinal-sys
      revision: b0b8cc2
      path: modules/zmk-rgbled-widget
    - name: zmk-pointing-acceleration-alpha
      remote: cardinal-sys
      revision: 780dfcd
      path: modules/zmk-pointing-acceleration-alpha
    - name: zmk-behavior-insomnia
      remote: cardinal-sys
      revision: 0ce76ae
      path: modules/zmk-behavior-insomnia

    - name: zmk-helpers                       # ⑦ keymap 記述ヘルパーマクロ
      remote: cardinal-sys
      revision: "7e0219e"
      path: modules/zmk-helpers

    - name: zmk-tri-state                     # ⑧ Swapper（スマート Cmd+Tab）
      remote: cardinal-sys
      revision: "2007896"
      path: modules/zmk-tri-state

    - name: zmk-auto-layer                    # ⑨ Smart Num（数字入力で自動レイヤー）
      remote: cardinal-sys
      revision: dfa7c69
      path: modules/zmk-auto-layer

  self:
    path: config
