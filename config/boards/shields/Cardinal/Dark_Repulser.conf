# BLE表示名
CONFIG_ZMK_KEYBOARD_NAME="Dark Repulser"

# NFC ピンを GPIO として使用（BLE干渉防止）
CONFIG_NFCT_PINS_AS_GPIOS=y

# 〈Reflex Boost〉— キースキャンデバウンス短縮（応答性向上）
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Bluetooth 接続の基本設定
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 左右同期方針: central 側 ZMK_BLE_PROFILE_COUNT=5 化に合わせて 6/6 へ追従
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
# 〈Redundant Sigil Cleanup〉— Elucidator側と同期（詳細は同ファイルのコメント参照）。
# PHY_2M / AUTO_PHY_UPDATE は既定が既にyのため明示指定は実効果ゼロ。
# CONFIG_BT_CTLR_PHY_2M=y
# CONFIG_BT_AUTO_PHY_UPDATE=y
# 〈Data Length Sigil Removal〉— Elucidator側と同期（詳細はElucidator.confのコメント参照）。
# Zephyr本家Issue #38782 既知のペアリング互換性問題を踏まえ既定へ委ねる。
# CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# CONFIG_BT_BUF_ACL_RX_SIZE=251
# CONFIG_BT_BUF_ACL_TX_SIZE=251

# 〈Bandwidth Surge〉— BLE TX/RX バッファ増量
# Zephyr 制約: BT_BUF_EVT_RX_COUNT > BT_BUF_ACL_TX_COUNT
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=16

# 接続パラメータの同期（右側 Elucidator と完全一致させる）
# BT_GAP_AUTO_UPDATE_CONN_PARAMS は Zephyr既定が既に y のため明示不要（撤去しても無変化）。
# CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
# 〈Conn Param Timeout Sigil Removal〉— Elucidator側と同期（詳細は同ファイルのコメント参照）。
# Bluetooth Core仕様（5秒待機）違反かつ出典元(zmk#3381)が非準拠と自認するレシピのため
# 既定5000msへ委ねる。
# CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=1000
# 〈Idle Tax Removal · Bilateral Sync〉— Elucidator側は2026-09-12〈Idle Tax Removal〉で
# 既に撤去済み（ZMK既定30＝データ無し接続イベントを最大30回スキップ可、に委ねる）だったが、
# Dark_Repulser側だけ0（毎接続イベント必須応答）のまま取りこぼされていた非対称を是正。
# 「右側と完全一致させる」という本ファイル自身の方針にも反していた。
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# 単位は 10ms。1000 = 10 秒だったが、Elucidator側の実験（Zephyr既定へ委ねる）に同期して撤去。
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=1000
# 接続インターバル範囲: Central と完全一致 (MIN 7.5ms / MAX 15ms / Apple HID 互換上限)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# スプリット接続パラメータ（Left-Right 間）
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=1000

# スリープ・Insomnia設定（右側と同期）
CONFIG_ZMK_IDLE_TIMEOUT=300000
# 〈Deep Sleep Sigil Removal〉— Elucidator側と同期（詳細は同ファイルのコメント参照）。
# ZMK本家Issue #3195のStudio×DeepSleep既知バグ回避のため撤去し原型と同じ既定へ。
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
# 〈Wakeful Vigil Suspension〉— 右側と同期し実験的に無効化（詳細はElucidator.conf/SYSTEM LOG参照）
# CONFIG_ZMK_INSOMNIA_PING_INTERVAL=3000
# CONFIG_ZMK_INSOMNIA_PING_ON_START=y

# 通信スタックの有効化（ポインティング・マウス）
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Rotary encoder（左手専用）
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=14
CONFIG_EC11_THREAD_STACK_SIZE=4096

# バッテリー・システム設定
CONFIG_ZMK_BATTERY_REPORTING=y

# Boot Retention（新方式）
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# ログサブシステム（ホスト BLE 接続維持に必須）
# USB_LOGGING=y 必須とされていた真因は LOG 処理スレッドの存在による
# スケジューラ挙動。USB CDC ACM は不要なので USB_LOGGING 自体は OFF。
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG=y
