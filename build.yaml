---
include:
  # 1号機（原初）── central: Elucidator / peripheral: Dark Repulser
  - board: xiao_ble/nrf52840/zmk
    shield: Elucidator rgbled_adapter
    snippet: studio-rpc-usb-uart
  - board: xiao_ble/nrf52840/zmk
    shield: Dark_Repulser rgbled_adapter
    # snippet: studio-rpc-usb-uart # 必要なら有効化
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset

  # 2号機 ── central のみ BLE 表示名を上書き（peripheral は1号機と共通の Dark Repulser を流用）
  - board: xiao_ble/nrf52840/zmk
    shield: Elucidator rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: '-DCONFIG_ZMK_KEYBOARD_NAME="Night Sky Sword"'
    artifact-name: Elucidator_NightSkySword

  # 3号機 ── central のみ BLE 表示名を上書き（peripheral は1号機と共通の Dark Repulser を流用）
  - board: xiao_ble/nrf52840/zmk
    shield: Elucidator rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: '-DCONFIG_ZMK_KEYBOARD_NAME="Holy Sword Excalibur"'
    artifact-name: Elucidator_Excalibur
